chor="start" font-weight="700">01  Solicitação e aprovação</text><text x="65" y="94" font-size="14" text-anchor="start" font-weight="400">Uma ADTCP por barreira • rotas de aprovação conforme classificação Redtag</text><rect x="60" y="150" width="330" height="1330" rx="0" fill="#ffffff" stroke="#8f98a3"/><rect x="60" y="150" width="330" height="50" rx="0" fill="#edf0f3" stroke="#8f98a3"/><text x="225.0" y="180" font-size="16" text-anchor="middle" font-weight="700">SOLICITANTE / LÍDER</text><rect x="390" y="150" width="330" height="1330" rx="0" fill="#ffffff" stroke="#8f98a3"/><rect x="390" y="150" width="330" height="50" rx="0" fill="#edf0f3" stroke="#8f98a3"/><text x="555.0" y="180" font-size="16" text-anchor="middle" font-weight="700">SISTEMA</text><rect x="720" y="150" width="330" height="1330" rx="0" fill="#ffffff" stroke="#8f98a3"/><rect x="720" y="150" width="330" height="50" rx="0" fill="#edf0f3" stroke="#8f98a3"/><text x="885.0" y="180" font-size="16" text-anchor="middle" font-weight="700">APROVADORES</text><text x="60" y="1520" font-size="13" text-anchor="start" font-weight="400">ADTCP  •  Gestão de bypass de camadas de proteção  |  Protótipo • Rev. 01 • 27/10/2026</text><text x="60" y="1545" font-size="12" text-anchor="start" font-weight="400">Modelo conceitual BPMN para implementação em Power Apps / Power Automate. Não é um processo executável.</text><circle cx="225" cy="250" r="19" fill="white" stroke="#354354" stroke-width="1.7"/><text x="225" y="293" font-size="13" text-anchor="middle" font-weight="400">Necessidade de bypass</text><rect x="110.0" y="316.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="225" y="346" font-size="14" text-anchor="middle" font-weight="400">Cadastrar ADTCP e anexar</text><text x="225" y="364" font-size="14" text-anchor="middle" font-weight="400">análise de risco</text><rect x="440.0" y="316.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="346" font-size="14" text-anchor="middle" font-weight="400">F01 • Validar dados, perfil,</text><text x="555" y="364" font-size="14" text-anchor="middle" font-weight="400">barreira e período</text><path d="M555,460.0 L585.0,490 L555,520.0 L525.0,490 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="555" y="497" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="555" y="447.0" font-size="14" text-anchor="middle" font-weight="400">Dados válidos?</text><rect x="110.0" y="451.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="225" y="490" font-size="14" text-anchor="middle" font-weight="400">Corrigir cadastro</text><path d="M555,590.0 L585.0,620 L555,650.0 L525.0,620 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="555" y="627" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="555" y="577.0" font-size="14" text-anchor="middle" font-weight="400">Barreira Redtag?</text><rect x="770.0" y="690.0" width="230" height="100" rx="10" fill="#ffffff" stroke="#354354"/><text x="885" y="731" font-size="14" text-anchor="middle" font-weight="400">F02 • Aprovar / rejeitar</text><text x="885" y="749" font-size="14" text-anchor="middle" font-weight="400">SSMA + Diretoria Industrial</text><path d="M879,777.0 v9" stroke="#354354"/><path d="M885,777.0 v9" stroke="#354354"/><path d="M891,777.0 v9" stroke="#354354"/><rect x="770.0" y="900.0" width="230" height="100" rx="10" fill="#ffffff" stroke="#354354"/><text x="885" y="941" font-size="14" text-anchor="middle" font-weight="400">F02 • Aprovar / rejeitar</text><text x="885" y="959" font-size="14" text-anchor="middle" font-weight="400">SSMA + Gerência da Unidade</text><path d="M879,987.0 v9" stroke="#354354"/><path d="M885,987.0 v9" stroke="#354354"/><path d="M891,987.0 v9" stroke="#354354"/><path d="M555,1050.0 L585.0,1080 L555,1110.0 L525.0,1080 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="555" y="1087" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="555" y="1037.0" font-size="14" text-anchor="middle" font-weight="400">Ambos aprovaram?</text><rect x="110.0" y="1081.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="225" y="1111" font-size="14" text-anchor="middle" font-weight="400">Receber comunicação</text><text x="225" y="1129" font-size="14" text-anchor="middle" font-weight="400">de rejeição</text><circle cx="225" cy="1270" r="19" fill="white" stroke="#354354" stroke-width="4"/><text x="225" y="1313" font-size="13" text-anchor="middle" font-weight="400">Solicitação rejeitada</text><rect x="440.0" y="1181.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="1211" font-size="14" text-anchor="middle" font-weight="400">Registrar AUTORIZADA</text><text x="555" y="1229" font-size="14" text-anchor="middle" font-weight="400">e congelar revisão aprovada</text><rect x="440.0" y="1301.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="1331" font-size="14" text-anchor="middle" font-weight="400">F07 • Comunicar autorização</text><text x="555" y="1349" font-size="14" text-anchor="middle" font-weight="400">ao líder e à lista</text><circle cx="555" cy="1430" r="19" fill="white" stroke="#354354" stroke-width="1.7"/><text x="555" y="1436" font-size="22" text-anchor="middle" font-weight="400">➜</text><text x="555" y="1473" font-size="13" text-anchor="middle" font-weight="400">A • Seguir para página 02</text><rect x="1080" y="150" width="350" height="330" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="178" font-size="16" text-anchor="start" font-weight="700">CADASTRO DA ADTCP</text><text x="1098" y="206" font-size="14" text-anchor="start" font-weight="400">Unidade, equipamento, tag da barreira e</text><text x="1098" y="225" font-size="14" text-anchor="start" font-weight="400">classificação Redtag.</text><text x="1098" y="254" font-size="14" text-anchor="start" font-weight="400">Líder, motivo, medidas compensatórias,</text><text x="1098" y="273" font-size="14" text-anchor="start" font-weight="400">início previsto e fim solicitado.</text><text x="1098" y="302" font-size="14" text-anchor="start" font-weight="400">Análise de risco obrigatória; prazo</text><text x="1098" y="321" font-size="14" text-anchor="start" font-weight="400">máximo inicial: 10 dias.</text><rect x="1080" y="505" width="350" height="390" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="533" font-size="16" text-anchor="start" font-weight="700">APROVAÇÃO CONJUNTA</text><text x="1098" y="561" font-size="14" text-anchor="start" font-weight="400">Marcador ||: decisões paralelas para os</text><text x="1098" y="580" font-size="14" text-anchor="start" font-weight="400">dois papéis indicados.</text><text x="1098" y="609" font-size="14" text-anchor="start" font-weight="400">Conclusão: uma rejeição OU ambas as</text><text x="1098" y="628" font-size="14" text-anchor="start" font-weight="400">aprovações. Sem resposta não significa</text><text x="1098" y="647" font-size="14" text-anchor="start" font-weight="400">aprovação.</text><text x="1098" y="676" font-size="14" text-anchor="start" font-weight="400">F02 notifica aprovadores e registra o</text><text x="1098" y="695" font-size="14" text-anchor="start" font-weight="400">resultado. Se rejeitada, comunica ao</text><text x="1098" y="714" font-size="14" text-anchor="start" font-weight="400">líder. Em Redtag, a Gerência da Unidade</text><text x="1098" y="733" font-size="14" text-anchor="start" font-weight="400">recebe ciência.</text><text x="1098" y="762" font-size="14" text-anchor="start" font-weight="400">Aprovadores são resolvidos pelo</text><text x="1098" y="781" font-size="14" text-anchor="start" font-weight="400">cadastro e pelo escopo da unidade.</text><rect x="1080" y="920" width="350" height="310" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="948" font-size="16" text-anchor="start" font-weight="700">EXCEÇÕES / REVISÃO</text><text x="1098" y="976" font-size="14" text-anchor="start" font-weight="400">Aprovador ausente ou ambíguo: bloquear</text><text x="1098" y="995" font-size="14" text-anchor="start" font-weight="400">submissão e tratar cadastro.</text><text x="1098" y="1024" font-size="14" text-anchor="start" font-weight="400">Timeout de aprovação: registrar</text><text x="1098" y="1043" font-size="14" text-anchor="start" font-weight="400">expiração e notificar líder; não</text><text x="1098" y="1062" font-size="14" text-anchor="start" font-weight="400">autorizar execução.</text><text x="1098" y="1091" font-size="14" text-anchor="start" font-weight="400">Alterar barreira, janela ou análise de</text><text x="1098" y="1110" font-size="14" text-anchor="start" font-weight="400">risco exige nova revisão e aprovação.</text><rect x="1080" y="1255" width="350" height="225" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="1283" font-size="16" text-anchor="start" font-weight="700">NOTAÇÃO / ESCOPO</text><text x="1098" y="1311" font-size="14" text-anchor="start" font-weight="400">Círculo: evento. Losango ×: decisão</text><text x="1098" y="1330" font-size="14" text-anchor="start" font-weight="400">exclusiva. Retângulo: tarefa.</text><text x="1098" y="1359" font-size="14" text-anchor="start" font-weight="400">Azul: atividade automática. A: ligação</text><text x="1098" y="1378" font-size="14" text-anchor="start" font-weight="400">entre páginas.</text><text x="1098" y="1407" font-size="14" text-anchor="start" font-weight="400">Desenho do protótipo, sujeito à</text><text x="1098" y="1426" font-size="14" text-anchor="start" font-weight="400">validação do procedimento interno.</text><polyline points="225,269.0 225,316.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="340.0,355 440.0,355" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="555,394.0 555,460.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arro oteção  |  Protótipo • Rev. 01 • 27/10/2026</text><text x="60" y="1545" font-size="12" text-anchor="start" font-weight="400">Modelo conceitual BPMN para implementação em Power Apps / Power Automate. Não é um processo executável.</text><circle cx="225" cy="245" r="19" fill="white" stroke="#354354" stroke-width="1.7"/><text x="225" y="251" font-size="22" text-anchor="middle" font-weight="400">➜</text><text x="225" y="288" font-size="13" text-anchor="middle" font-weight="400">A • Autorização da página 01</text><rect x="440.0" y="206.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="236" font-size="14" text-anchor="middle" font-weight="400">F03 • Conferir revisão</text><text x="555" y="254" font-size="14" text-anchor="middle" font-weight="400">e janela autorizada</text><path d="M555,345.0 L585.0,375 L555,405.0 L525.0,375 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="555" y="382" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="555" y="332.0" font-size="14" text-anchor="middle" font-weight="400">Execução permitida?</text><rect x="440.0" y="471.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="501" font-size="14" text-anchor="middle" font-weight="400">Bloquear execução;</text><text x="555" y="519" font-size="14" text-anchor="middle" font-weight="400">registrar motivo e notificar</text><circle cx="555" cy="630" r="19" fill="white" stroke="#354354" stroke-width="4"/><text x="555" y="673" font-size="13" text-anchor="middle" font-weight="400">Não executada</text><rect x="110.0" y="336.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="225" y="366" font-size="14" text-anchor="middle" font-weight="400">Confirmar medidas</text><text x="225" y="384" font-size="14" text-anchor="middle" font-weight="400">compensatórias</text><rect x="110.0" y="511.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="225" y="532" font-size="14" text-anchor="middle" font-weight="400">Desativar barreira e</text><text x="225" y="550" font-size="14" text-anchor="middle" font-weight="400">registrar</text><text x="225" y="568" font-size="14" text-anchor="middle" font-weight="400">início real + evidência</text><rect x="440.0" y="711.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="741" font-size="14" text-anchor="middle" font-weight="400">F03 / F07 • Registrar ATIVO</text><text x="555" y="759" font-size="14" text-anchor="middle" font-weight="400">e comunicar desativação</text><rect x="110.0" y="876.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="225" y="906" font-size="14" text-anchor="middle" font-weight="400">Restabelecer barreira;</text><text x="225" y="924" font-size="14" text-anchor="middle" font-weight="400">registrar data e evidência</text><rect x="440.0" y="991.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="1021" font-size="14" text-anchor="middle" font-weight="400">F05 • Registrar</text><text x="555" y="1039" font-size="14" text-anchor="middle" font-weight="400">AGUARDANDO VERIFICAÇÃO</text><rect x="770.0" y="991.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="885" y="1021" font-size="14" text-anchor="middle" font-weight="400">F06 • Verificar retorno</text><text x="885" y="1039" font-size="14" text-anchor="middle" font-weight="400">da função de proteção</text><path d="M885,1130.0 L915.0,1160 L885,1190.0 L855.0,1160 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="885" y="1167" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="885" y="1117.0" font-size="14" text-anchor="middle" font-weight="400">Restabelecimento aceito?</text><rect x="110.0" y="1261.0" width="230" height="78" rx="10" fill="#ffffff" stroke="#354354"/><text x="225" y="1291" font-size="14" text-anchor="middle" font-weight="400">Tratar pendência e</text><text x="225" y="1309" font-size="14" text-anchor="middle" font-weight="400">complementar evidência</text><rect x="440.0" y="1261.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="555" y="1273" font-size="14" text-anchor="middle" font-weight="400">F06 / F07 • Registrar</text><text x="555" y="1291" font-size="14" text-anchor="middle" font-weight="400">ENCERRADA</text><text x="555" y="1309" font-size="14" text-anchor="middle" font-weight="400">e comunicar à lista e ao</text><text x="555" y="1327" font-size="14" text-anchor="middle" font-weight="400">líder</text><circle cx="555" cy="1430" r="19" fill="white" stroke="#354354" stroke-width="4"/><text x="555" y="1473" font-size="13" text-anchor="middle" font-weight="400">ADTCP encerrada</text><rect x="1080" y="150" width="350" height="300" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="178" font-size="16" text-anchor="start" font-weight="700">EVIDÊNCIAS DISTINTAS</text><text x="1098" y="206" font-size="14" text-anchor="start" font-weight="400">Desativação: executor, data/hora real e</text><text x="1098" y="225" font-size="14" text-anchor="start" font-weight="400">evidência da intervenção.</text><text x="1098" y="254" font-size="14" text-anchor="start" font-weight="400">Restabelecimento: executor, data/hora</text><text x="1098" y="273" font-size="14" text-anchor="start" font-weight="400">real e evidência do retorno.</text><text x="1098" y="302" font-size="14" text-anchor="start" font-weight="400">Verificação: responsável, decisão,</text><text x="1098" y="321" font-size="14" text-anchor="start" font-weight="400">data/hora e comentário.</text><rect x="1080" y="475" width="350" height="365" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="503" font-size="16" text-anchor="start" font-weight="700">PREMISSAS A VALIDAR</text><text x="1098" y="531" font-size="14" text-anchor="start" font-weight="400">Janela fixa: início real posterior não</text><text x="1098" y="550" font-size="14" text-anchor="start" font-weight="400">desloca o fim autorizado.</text><text x="1098" y="579" font-size="14" text-anchor="start" font-weight="400">Medidas compensatórias devem estar</text><text x="1098" y="598" font-size="14" text-anchor="start" font-weight="400">confirmadas antes da execução.</text><text x="1098" y="627" font-size="14" text-anchor="start" font-weight="400">Responsável e critérios de verificação</text><text x="1098" y="646" font-size="14" text-anchor="start" font-weight="400">do restabelecimento: A DEFINIR.</text><text x="1098" y="675" font-size="14" text-anchor="start" font-weight="400">Recusa da verificação mantém a ADTCP</text><text x="1098" y="694" font-size="14" text-anchor="start" font-weight="400">aberta; condição operacional deve ser</text><text x="1098" y="713" font-size="14" text-anchor="start" font-weight="400">registrada.</text><rect x="1080" y="865" width="350" height="340" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="893" font-size="16" text-anchor="start" font-weight="700">REGRAS DO PROTÓTIPO</text><text x="1098" y="921" font-size="14" text-anchor="start" font-weight="400">Não permitir desativação sem revisão</text><text x="1098" y="940" font-size="14" text-anchor="start" font-weight="400">aprovada e vigente.</text><text x="1098" y="969" font-size="14" text-anchor="start" font-weight="400">Evidência de execução não substitui</text><text x="1098" y="988" font-size="14" text-anchor="start" font-weight="400">aprovação.</text><text x="1098" y="1017" font-size="14" text-anchor="start" font-weight="400">Não permitir encerramento automático</text><text x="1098" y="1036" font-size="14" text-anchor="start" font-weight="400">por vencimento.</text><text x="1098" y="1065" font-size="14" text-anchor="start" font-weight="400">Prorrogação e tratamento de bypass</text><text x="1098" y="1084" font-size="14" text-anchor="start" font-weight="400">emergencial: fora do MVP; dependem do</text><text x="1098" y="1103" font-size="14" text-anchor="start" font-weight="400">procedimento.</text><rect x="1080" y="1230" width="350" height="250" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="1258" font-size="16" text-anchor="start" font-weight="700">DADOS / AUTOMAÇÃO</text><text x="1098" y="1286" font-size="14" text-anchor="start" font-weight="400">Datas previstas, aprovadas e reais</text><text x="1098" y="1305" font-size="14" text-anchor="start" font-weight="400">ficam separadas.</text><text x="1098" y="1334" font-size="14" text-anchor="start" font-weight="400">F03, F05 e F06 validam identidade e</text><text x="1098" y="1353" font-size="14" text-anchor="start" font-weight="400">permissão no servidor.</text><text x="1098" y="1382" font-size="14" text-anchor="start" font-weight="400">F07 registra envio, falha e tentativa</text><text x="1098" y="1401" font-size="14" text-anchor="start" font-weight="400">de reenvio.</text><polyline points="244.0,245 440.0,245" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="555,284.0 555,345.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="555,405.0 555,471.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="563.5" y="433" width="33" height="21" fill="white"/><text x="580" y="447" text-anchor="middle" font-size="13">Não</text><polyline points="555,549.0 555,611.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="525.0,375 340.0,375" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="373.5" y="346" width="33" height="21" fill="white"/><text x="390" y="360" text-anchor="middle" font-size="13">Sim</text><polyline points="225,414.0 225,511.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="225,589.0 225,750 440.0,750" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="555,789.0 555,850 225,850 225,876.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="225,954.0 225,1030 440.0,1030" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="670.0,1030 770.0,1030" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="885,1069.0 885,1130.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="885,1190.0 885,1230 555,1230 555,1261.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="703.5" y="1203" width="33" height="21" fill="white"/><text x="720" y="1217" text-anchor="middle" font-size="13">Sim</text><polyline points="855.0,1160 225,1160 225,1261.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="373.5" y="1133" width="33" height="21" fill="white"/><text x="390" y="1147" text-anchor="middle" font-size="13">Não</text><polyline points="110.0,1300 95,1300 95,915 110.0,915" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="555,1339.0 555,1411.0" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/></svg></section><section class="sheet "><svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1580" viewBox="0 0 1480 1580" style="font-family:Arial,Helvetica,sans-serif;fill:#263445"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526173"/></marker></defs><rect x="0" y="0" width="1480" height="1580" rx="0" fill="#ffffff" stroke="none"/><rect x="40" y="40" width="6" height="62" rx="0" fill="#ed7626" stroke="none"/><text x="65" y="63" font-size="28" text-anchor="start" font-weight="700">03  Monitoramento e comunicação</text><text x="65" y="94" font-size="14" text-anchor="start" font-weight="400">Processo agendado independente • prazo vencido não encerra a ADTCP</text><rect x="60" y="150" width="660" height="1330" rx="0" fill="#ffffff" stroke="#8f98a3"/><rect x="60" y="150" width="660" height="50" rx="0" fill="#edf0f3" stroke="#8f98a3"/><text x="390.0" y="180" font-size="16" text-anchor="middle" font-weight="700">SISTEMA / POWER AUTOMATE</text><rect x="720" y="150" width="330" height="1330" rx="0" fill="#ffffff" stroke="#8f98a3"/><rect x="720" y="150" width="330" height="50" rx="0" fill="#edf0f3" stroke="#8f98a3"/><text x="885.0" y="180" font-size="16" text-anchor="middle" font-weight="700">SISTEMA / COMUNICAÇÕES</text><text x="60" y="1520" font-size="13" text-anchor="start" font-weight="400">ADTCP  •  Gestão de bypass de camadas de proteção  |  Protótipo • Rev. 01 • 27/10/2026</text><text x="60" y="1545" font-size="12" text-anchor="start" font-weight="400">Modelo conceitual BPMN para implementação em Power Apps / Power Automate. Não é um processo executável.</text><circle cx="225" cy="250" r="19" fill="white" stroke="#354354" stroke-width="1.7"/><circle cx="225" cy="250" r="14" fill="none" stroke="#354354"/><path d="M225,240 V250 L232,253" fill="none" stroke="#354354"/><text x="225" y="293" font-size="13" text-anchor="middle" font-weight="400">F04 • A cada ciclo</text><rect x="110.0" y="326.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="225" y="356" font-size="14" text-anchor="middle" font-weight="400">Consultar ADTCP abertas</text><text x="225" y="374" font-size="14" text-anchor="middle" font-weight="400">e parâmetros vigentes</text><rect x="110.0" y="471.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="225" y="501" font-size="14" text-anchor="middle" font-weight="400">Para cada ADTCP:</text><text x="225" y="519" font-size="14" text-anchor="middle" font-weight="400">verificar prazo e situação</text><path d="M555,480.0 L585.0,510 L555,540.0 L525.0,510 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="555" y="517" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="555" y="467.0" font-size="14" text-anchor="middle" font-weight="400">Vencido, sem retorno confirmado?</text><rect x="770.0" y="471.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="885" y="501" font-size="14" text-anchor="middle" font-weight="400">F07 • Alertar vencimento</text><text x="885" y="519" font-size="14" text-anchor="middle" font-weight="400">e escalonar responsáveis</text><path d="M555,725.0 L585.0,755 L555,785.0 L525.0,755 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="555" y="762" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="555" y="712.0" font-size="14" text-anchor="middle" font-weight="400">Aviso D−n aplicável?</text><rect x="770.0" y="716.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="885" y="746" font-size="14" text-anchor="middle" font-weight="400">F07 • Enviar lembrete</text><text x="885" y="764" font-size="14" text-anchor="middle" font-weight="400">se frequência f permitir</text><rect x="110.0" y="861.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="225" y="891" font-size="14" text-anchor="middle" font-weight="400">Sem aviso de bypass</text><text x="225" y="909" font-size="14" text-anchor="middle" font-weight="400">neste ciclo</text><rect x="770.0" y="981.0" width="230" height="78" rx="10" fill="#eef5fc" stroke="#354354"/><text x="885" y="1011" font-size="14" text-anchor="middle" font-weight="400">Registrar resultado do envio</text><text x="885" y="1029" font-size="14" text-anchor="middle" font-weight="400">e evitar duplicação</text><path d="M555,1130.0 L585.0,1160 L555,1190.0 L525.0,1160 Z" fill="#fff5e8" stroke="#354354" stroke-width="1.6"/><text x="555" y="1167" font-size="25" text-anchor="middle" font-weight="400">×</text><text x="555" y="1117.0" font-size="14" text-anchor="middle" font-weight="400">Há outra ADTCP?</text><circle cx="555" cy="1350" r="19" fill="white" stroke="#354354" stroke-width="4"/><text x="555" y="1393" font-size="13" text-anchor="middle" font-weight="400">Fim do ciclo</text><rect x="1080" y="150" width="350" height="300" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="178" font-size="16" text-anchor="start" font-weight="700">PARÂMETROS INICIAIS</text><text x="1098" y="206" font-size="14" text-anchor="start" font-weight="400">prazo_maximo_dias = 10.</text><text x="1098" y="235" font-size="14" text-anchor="start" font-weight="400">n_dias_notificacao = 3.</text><text x="1098" y="264" font-size="14" text-anchor="start" font-weight="400">f_notificacao = 1 dia.</text><text x="1098" y="293" font-size="14" text-anchor="start" font-weight="400">Fuso de exibição: America/Bahia.</text><text x="1098" y="322" font-size="14" text-anchor="start" font-weight="400">Horário do ciclo e destinatários de</text><text x="1098" y="341" font-size="14" text-anchor="start" font-weight="400">escalonamento: A DEFINIR.</text><rect x="1080" y="475" width="350" height="390" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="503" font-size="16" text-anchor="start" font-weight="700">DESTINATÁRIOS / EVENTOS</text><text x="1098" y="531" font-size="14" text-anchor="start" font-weight="400">Submissão: aprovadores; gerente da</text><text x="1098" y="550" font-size="14" text-anchor="start" font-weight="400">unidade recebe ciência no Redtag.</text><text x="1098" y="579" font-size="14" text-anchor="start" font-weight="400">Autorização e desativação: líder +</text><text x="1098" y="598" font-size="14" text-anchor="start" font-weight="400">lista de comunicação.</text><text x="1098" y="627" font-size="14" text-anchor="start" font-weight="400">Lembretes: líder e responsáveis</text><text x="1098" y="646" font-size="14" text-anchor="start" font-weight="400">definidos.</text><text x="1098" y="675" font-size="14" text-anchor="start" font-weight="400">Vencimento: líder + SSMA + responsável</text><text x="1098" y="694" font-size="14" text-anchor="start" font-weight="400">da rota, conforme matriz validada.</text><text x="1098" y="723" font-size="14" text-anchor="start" font-weight="400">Encerramento: líder + lista.</text><rect x="1080" y="890" width="350" height="300" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="918" font-size="16" text-anchor="start" font-weight="700">OUTRAS VERIFICAÇÕES F04</text><text x="1098" y="946" font-size="14" text-anchor="start" font-weight="400">Autorização expirada sem início real:</text><text x="1098" y="965" font-size="14" text-anchor="start" font-weight="400">bloquear execução e comunicar.</text><text x="1098" y="994" font-size="14" text-anchor="start" font-weight="400">Aprovação pendente: aplicar SLA e</text><text x="1098" y="1013" font-size="14" text-anchor="start" font-weight="400">expiração definidos.</text><text x="1098" y="1042" font-size="14" text-anchor="start" font-weight="400">Aguardando verificação: cobrar</text><text x="1098" y="1061" font-size="14" text-anchor="start" font-weight="400">responsável; manter acompanhamento até</text><text x="1098" y="1080" font-size="14" text-anchor="start" font-weight="400">retorno confirmado.</text><rect x="1080" y="1215" width="350" height="265" rx="7" fill="#f6f7f9" stroke="#ccd3dc"/><text x="1098" y="1243" font-size="16" text-anchor="start" font-weight="700">IMPLEMENTAÇÃO / CONTROLE</text><text x="1098" y="1271" font-size="14" text-anchor="start" font-weight="400">Chave de envio: ADTCP + revisão +</text><text x="1098" y="1290" font-size="14" text-anchor="start" font-weight="400">evento + janela de notificação.</text><text x="1098" y="1319" font-size="14" text-anchor="start" font-weight="400">Registrar sucesso/falha. Reprocessar</text><text x="1098" y="1338" font-size="14" text-anchor="start" font-weight="400">somente envios pendentes.</text><text x="1098" y="1367" font-size="14" text-anchor="start" font-weight="400">Não depender de um fluxo em espera por</text><text x="1098" y="1386" font-size="14" text-anchor="start" font-weight="400">todo o período do bypass.</t
